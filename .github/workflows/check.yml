name: Check connector
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python tests/check.py
      - run: uv run python tests/check_two_agents.py
      - run: uv build
      - run: docker build -t shared-memory-check .
      - run: python tests/check_stdio.py docker run --rm -i shared-memory-check
